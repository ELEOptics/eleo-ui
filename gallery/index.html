<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ELEO plots gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/packages/tokens/dist/tokens.css">
  <link rel="stylesheet" href="/packages/plots/dist/plots.css">
  <style>
    /* Every renderer, one per line, the light theme then the dark: the review surface for any change to a plot or token. */
    body { margin: 0; font: 400 15px/22px var(--font-sans); background: var(--ground); color: var(--ink); }
    header { padding: 24px 32px 8px; }
    header h1 { margin: 0 0 4px; font-size: 28px; line-height: 34px; }
    header p { margin: 0; color: var(--ink-muted); max-width: 72ch; }
    header .palette { margin-top: 12px; }
    .themes { display: grid; grid-template-columns: minmax(0, 1fr); }
    .theme { min-width: 0; background: var(--ground); color: var(--ink); padding: 24px 32px 48px; display: grid; gap: 12px; align-content: start; }
    .theme > h2 { margin: 0; font-size: 16px; }
    /* One tile per line, the page wide, the light theme then the dark. --tile-min is set per tile from ELEO.minWidth for its call plus 26 px of chrome, by tileMins() below;
       narrower than that the body keeps that width and the tile scrolls sideways, so the page never does. */
    .theme > .eleo-plot { overflow-x: auto; }
    .theme > .eleo-plot > .eleo-plot__body { box-sizing: border-box; min-width: calc(var(--tile-min, 240px) - 2px); }
    .map { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    .map .eleo-colorbar i { height: 100%; }
    .icons { display: flex; flex-wrap: wrap; gap: 10px; color: var(--ink-muted); }
  </style>
</head>
<body>
  <header>
    <h1>ELEO plots</h1>
    <p>Every renderer in @eleoptics/plots, drawn from the sample achromat, in both themes. Check this page after any change to a renderer or a token.</p>
    <form class="palette"><div class="eleo-seg" role="radiogroup" aria-label="Palette"><label><input type="radio" name="palette" value="standard" checked><span>Standard</span></label><label><input type="radio" name="palette" value="red-green"><span>Red-green</span></label><label><input type="radio" name="palette" value="blue-yellow"><span>Blue-yellow</span></label></div></form>
  </header>
  <main class="themes">
    <section class="theme" data-theme="light"><h2>Light</h2></section>
    <section class="theme" data-theme="dark"><h2>Dark</h2></section>
  </main>
  <template id="tiles">
    <section class="eleo-plot" data-tile="layout2D" data-size="layout2D"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">Layout2D</h3><span class="eleo-plot__meta">YZ, marginal and chief</span><span class="eleo-plot__key">Color: field</span></div><div class="eleo-plot__body" data-svg="layout2D"></div><div class="eleo-plot__ft eleo-legend" data-legend="field"></div></section>
    <section class="eleo-plot" data-tile="layout2D-fan" data-size="layout2D"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">Layout2D</h3><span class="eleo-plot__meta">fan, on axis</span><span class="eleo-plot__key">Color: wavelength</span></div><div class="eleo-plot__body" data-svg="layout2D-fan"></div><div class="eleo-plot__ft eleo-legend" data-legend="wavelength"></div></section>
    <section class="eleo-plot" data-tile="layout2D-shared" data-size="layout2D"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">Layout2D</h3><span class="eleo-plot__meta">merit singlet, before then after, one box</span><span class="eleo-plot__key">Color: field</span></div><div class="eleo-plot__body" data-svg="merit-before"></div><div class="eleo-plot__body" data-svg="merit-after"></div></section>
    <section class="eleo-plot" data-tile="layout2D-glasses" data-size="layout2D"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">Layout2D</h3><span class="eleo-plot__meta">Cooke triplet, glasses N-SK16 / F2 / N-SK16</span><span class="eleo-plot__key">Color: field</span></div><div class="eleo-plot__body" data-svg="layout2D-glasses"></div><div class="eleo-plot__ft eleo-legend" data-legend="glass"></div></section>
    <section class="eleo-plot" data-tile="layout2D-wandersleb" data-size="layout2D"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">Layout2D</h3><span class="eleo-plot__meta">Wandersleb triplet, recorded, fan with ray status</span><span class="eleo-plot__key">Color: field</span></div><div class="eleo-plot__body" data-svg="layout2D-wandersleb"></div></section>
    <section class="eleo-plot" data-tile="layout2D-cassegrain" data-size="layout2D"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">Layout2D</h3><span class="eleo-plot__meta">Cassegrain, recorded, on-axis chief obscured</span><span class="eleo-plot__key">Color: field</span></div><div class="eleo-plot__body" data-svg="layout2D-cassegrain"></div></section>
      <section class="eleo-plot" data-tile="spot" data-size="spot"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">SpotDiagram</h3><span class="eleo-plot__key">Color: wavelength</span></div><div class="eleo-plot__body" data-svg="spot"></div></section>
      <section class="eleo-plot" data-tile="throughFocus" data-size="throughFocus"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">Through focus</h3></div><div class="eleo-plot__body" data-svg="throughFocus"></div></section>
      <section class="eleo-plot" data-tile="footprint" data-size="spot"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">SpotDiagram</h3><span class="eleo-plot__meta">Beam footprint, Cooke, at the stop</span><span class="eleo-plot__key">Color: field</span></div><div class="eleo-plot__body" data-svg="footprint"></div><div class="eleo-plot__ft eleo-legend" data-legend="footprint"></div></section>
      <section class="eleo-plot" data-tile="seidel" data-size="bars"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">BarPlot</h3><span class="eleo-plot__meta">Seidel sums, mm</span></div><div class="eleo-plot__body" data-svg="seidel"></div></section>
      <section class="eleo-plot" data-tile="seidel-terms" data-size="bars"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">BarPlot</h3><span class="eleo-plot__meta">Seidel sums by term, mm</span></div><div class="eleo-plot__body" data-svg="seidel-terms"></div></section>
      <section class="eleo-plot" data-tile="rayFan" data-size="rayFan"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">RayFan</h3><span class="eleo-plot__meta">Achromat, recorded, TRA from the chief ray, µm</span></div><div class="eleo-plot__body" data-svg="rayFan"></div><div class="eleo-plot__ft eleo-legend" data-legend="ts"></div></section>
      <section class="eleo-plot" data-tile="rayFan-opd" data-size="rayFan"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">RayFan</h3><span class="eleo-plot__meta">OPD, waves</span></div><div class="eleo-plot__body" data-svg="rayFan-opd"></div></section>
      <section class="eleo-plot" data-tile="psf"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">Map2D</h3><span class="eleo-plot__meta">PSF, linear</span></div><div class="eleo-plot__body map"><canvas data-canvas="psf"></canvas><div class="eleo-colorbar"><i data-bar="ember"></i><span><b>1</b><b>0</b></span></div></div></section>
      <section class="eleo-plot" data-tile="wavefront"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">Map2D</h3><span class="eleo-plot__meta">wavefront, waves</span></div><div class="eleo-plot__body map"><canvas data-canvas="wavefront"></canvas><div class="eleo-colorbar"><i data-bar="wave"></i><span><b>+</b><b>0</b><b>−</b></span></div></div></section>
    <section class="eleo-plot" data-tile="psf-recorded" data-size="map2D"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">Map2D</h3><span class="eleo-plot__meta">Cooke triplet PSF, recorded, mm</span></div><div class="eleo-plot__body" data-map="psf-recorded"></div></section>
      <section class="eleo-plot" data-tile="psf-log" data-size="map2D"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">Map2D</h3><span class="eleo-plot__meta">Cooke triplet PSF, recorded, log</span></div><div class="eleo-plot__body" data-map="psf-log"></div></section>
      <section class="eleo-plot" data-tile="wavefront-recorded" data-size="map2D"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">Map2D</h3><span class="eleo-plot__meta">Cooke triplet wavefront, recorded, waves</span></div><div class="eleo-plot__body" data-map="wavefront-recorded"></div></section>
    <section class="eleo-plot" data-tile="irradiance-gaussian" data-size="map2D"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">Map2D</h3><span class="eleo-plot__meta">TEM00 Gaussian irradiance, synthetic, w = 1 mm</span></div><div class="eleo-plot__body" data-map="irradiance-gaussian"></div></section>
      <section class="eleo-plot" data-tile="mtf" data-size="curve"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">CurvePlot</h3><span class="eleo-plot__meta">MTF</span></div><div class="eleo-plot__body" data-svg="mtf"></div></section>
      <section class="eleo-plot" data-tile="mtf-limits" data-size="curve"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">CurvePlot</h3><span class="eleo-plot__meta">MTF, requirement limits</span></div><div class="eleo-plot__body" data-svg="mtf-limits"></div></section>
      <section class="eleo-plot" data-tile="fieldCurvature" data-size="curve"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">CurvePlot</h3><span class="eleo-plot__meta">field curvature</span></div><div class="eleo-plot__body" data-svg="fieldCurvature"></div></section>
      <section class="eleo-plot" data-tile="distortion" data-size="curve"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">CurvePlot</h3><span class="eleo-plot__meta">distortion</span></div><div class="eleo-plot__body" data-svg="distortion"></div></section>
      <section class="eleo-plot" data-tile="chromaticFocus" data-size="curve"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">CurvePlot</h3><span class="eleo-plot__meta">chromatic focus</span></div><div class="eleo-plot__body" data-svg="chromaticFocus"></div></section>
      <section class="eleo-plot" data-tile="layout3D"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">Layout3D</h3><span class="eleo-plot__meta">iso</span></div><div class="eleo-plot__body"><canvas data-canvas="layout3D" width="480" height="300"></canvas></div></section>
      <section class="eleo-plot" data-tile="airy"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">physics: airy + colormap</h3><span class="eleo-plot__meta">f/4, 587.6 nm, √ intensity</span></div><div class="eleo-plot__body"><canvas data-canvas="airy" width="240" height="240"></canvas></div></section>
    <!-- Segmented control specimen, not a tile. Each column's <form> scopes its own radio group. -->
    <form><div class="eleo-seg" role="radiogroup" aria-label="Units"><label><input type="radio" name="units" value="um" checked><span>µm</span></label><label><input type="radio" name="units" value="waves"><span>waves</span></label><label><input type="radio" name="units" value="mm"><span>mm</span></label></div></form>
    <section class="eleo-plot" data-tile="icons"><div class="eleo-plot__hd"><h3 class="eleo-plot__title">Icons</h3><span class="eleo-plot__meta">glass, then line</span></div><div class="eleo-plot__body icons" data-icons></div></section>
  </template>
  <script src="/packages/plots/dist/eleo-plots.js"></script>
  <script src="/packages/plots/dist/eleo-plots-sample.js"></script>
  <script>
    // The sample tiles keep their framing: a pinned box, not the rays' bounds. If eleo-plots-sample.js failed to load,
    // ELEO.sample is null, SAMPLE_BOX stays null and the sample tiles draw nothing while the rest of the page draws.
    var SAMPLE_BOX = ELEO.sample && { zmin: -8, zmax: ELEO.sample.zimg + 4, ylo: -13.5, yhi: 13.5 };
    // The merit tile draws before and after in one box, so both share a scale. Filled by fetch() below;
    // if either fixture fails, MERIT_BOX stays unset and the tile draws nothing while the rest of the page draws.
    var MERIT = {}, MERIT_BOX;
    // The glasses tile: analysis.json with named glasses (tests/fixtures/layouts/README.md). Filled by fetch() below;
    // if the fixture fails, GLASSES stays unset and only this tile draws nothing.
    var GLASSES;
    // The MTF, field curvature, distortion, spot and Seidel tiles (the recorded achromat) and the Wandersleb and Cassegrain layout tiles (tests/fixtures/phos-core/README.md)
    // through ELEOAdapters, one fixture each (the Seidel fixture feeds two tiles). Filled by fetch() below; if the script or a recording fails, that
    // key stays unset and only its tile draws nothing.
    var REC = {};
    // Each tile names the data it needs and draws from it. draw() below calls a tile only when `need()` gives something;
    // otherwise the tile draws nothing and the rest of the page draws.
    function sampleBox() { return SAMPLE_BOX; }
    function meritTile(k, w) {
      try { return ELEO.layout2D({ data: MERIT[k], width: w, box: MERIT_BOX, labels: ['0°', '12°', '24°'], marks: false }); }
      catch (e) { console.error('merit-' + k + ':', e); return ''; }
    }
    // A recorded tile: draws REC[k] (the adapter's result) through the renderer `render`; blank while REC[k] is unset.
    // draw(data, w) gets the body's content width; every framed tile passes it on as `width` (ADR-0003).
    function recTile(k, render) { return { need: function () { return REC[k]; }, draw: function (d, w) { return render(d, w); } }; }
    function atWidth(d, w, more) { return Object.assign({}, d, more, { width: w }); }
    var MTF_LIMITS = [{ y: 0.3, label: 'MTF \u2265 0.3' }, { x: 50 }, { y: [0, 0.3] }];
    var SVG = {
      'layout2D': { need: sampleBox, draw: function (box, w) { return ELEO.layout2D({ width: w, box: box }); } },
      'layout2D-fan': { need: sampleBox, draw: function (box, w) { return ELEO.layout2D({ width: w, box: box, colorBy: 'wavelength', rays: 'fan' }); } },
      'merit-before': { need: function () { return MERIT_BOX; }, draw: function (_, w) { return meritTile('before', w); } },
      'merit-after': { need: function () { return MERIT_BOX; }, draw: function (_, w) { return meritTile('after', w); } },
      'layout2D-glasses': { need: function () { return GLASSES; }, draw: function (d, w) { return ELEO.layout2D({ data: d, width: w, marks: false }); } },
      'layout2D-wandersleb': recTile('layout', function (d, w) { return ELEO.layout2D(atWidth(d, w)); }),
      'layout2D-cassegrain': recTile('cassegrainLayout', function (d, w) { return ELEO.layout2D(atWidth(d, w)); }),
      'spot': recTile('spot', function (d, w) { return ELEO.spot(atWidth(d, w)); }),
      'footprint': recTile('footprint', function (d, w) { return ELEO.spot(atWidth(d, w)); }),
      // A y limit reads as a requirement: the sums stay within 0.05 mm (the data reaches 0.07).
      'seidel': recTile('seidel', function (d, w) { return ELEO.bars(atWidth(d, w, { limits: [{ y: 0.05, label: '0.05 mm' }] })); }),
      'seidel-terms': recTile('seidelTerms', function (d, w) { return ELEO.bars(atWidth(d, w)); }),
      'throughFocus': { need: sampleBox, draw: function (_, w) { return ELEO.throughFocus({ width: w }); } },
      // The recorded achromat's fans through curve, as tall as rayFan's panels are (PLOT_SIZES.rayFan.aspect) over its columns.
      'rayFan': recTile('fans', function (d, w) { return ELEO.curve(atWidth(d, w, { height: w * ELEO.PLOT_SIZES.rayFan.aspect / d.columns })); }),
      'rayFan-opd': { need: sampleBox, draw: function (_, w) { return ELEO.rayFan({ kind: 'opd', width: w }); } },
      'mtf': recTile('mtf', function (d, w) { return ELEO.curve(atWidth(d, w)); }),
      // The same recording as the MTF tile, with a requirement line, a spatial-frequency marker and a below-requirement band.
      'mtf-limits': recTile('mtf', function (d, w) { return ELEO.curve(atWidth(d, w, { limits: MTF_LIMITS })); }),
      'fieldCurvature': recTile('fieldCurvature', function (d, w) { return ELEO.curve(atWidth(d, w)); }),
      'distortion': recTile('distortion', function (d, w) { return ELEO.curve(atWidth(d, w)); }),
      'chromaticFocus': { need: sampleBox, draw: function (_, w) { return ELEO.curve({ kind: 'chromaticFocus', width: w }); } }
    };
    function airyTile(canvas) {
      var n = canvas.width, ctx = canvas.getContext('2d'), img = ctx.createImageData(n, n), lut = ELEO.colormap('ember', canvas), span = 24;
      for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) {
        var r = Math.hypot(x + 0.5 - n / 2, y + 0.5 - n / 2) / n * span, c = lut[Math.round(Math.sqrt(ELEO.airy(r, 0.5876, 4)) * 255)], p = (y * n + x) * 4;
        img.data[p] = c[0]; img.data[p + 1] = c[1]; img.data[p + 2] = c[2]; img.data[p + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
    }
    // Canvas tiles read their colors once per draw, so a palette change redraws them; SVG recolors through CSS.
    // The typed map bakes its colors from the tile it is given as `el`, so a palette change redraws it (drawMaps) beside the canvases, and load leaves it to fit's first draw; a failure blanks only that tile.
    var MAPS = {};
    // Closed form, not a recording: phos-core's irradiance needs a nonsequential trace. TEM00, I = exp(-2 r^2 / w^2), w = 1 mm, 128 x 128 cells over +-2 mm.
    MAPS['irradiance-gaussian'] = (function () {
      var n = 128, w = 1, h = 4 / n;
      return {
        values: Array.from({ length: n }, function (_, j) { return Array.from({ length: n }, function (_, i) {
          var x = -2 + (i + 0.5) * h, y = 2 - (j + 0.5) * h;
          return Math.exp(-2 * (x * x + y * y) / (w * w));
        }); }),
        extent: [-2, 2, -2, 2], map: 'ember',
        x: { label: 'x', unit: 'mm' }, y: { label: 'y', unit: 'mm' }, value: { label: 'Irradiance', unit: 'relative' }
      };
    })();
    // A typed map draws at its body's width (set by fit; unset, the renderer's default); a palette change redraws it at that width.
    function drawMap(body) {
      body.innerHTML = '';
      var props = MAPS[body.dataset.map];
      if (!props) return;
      try { body.innerHTML = ELEO.map2D(Object.assign({}, props, { el: body.parentNode, width: body._w })); }
      catch (e) { console.error('gallery: ' + body.dataset.map + ' tile skipped:', e); }
    }
    function drawMaps() {
      document.querySelectorAll('.theme [data-map]').forEach(drawMap);
    }
    function drawCanvases() {
      document.querySelectorAll('.theme [data-canvas]').forEach(function (el) {
        var k = el.dataset.canvas;
        if (k === 'airy') airyTile(el);
        else if (!SAMPLE_BOX) return;
        else if (k === 'layout3D') ELEO.layout3D(el);
        else ELEO.map2D(el, { kind: k });
      });
    }
    // Each tile's minimum width: its ELEO.minWidth for the call it draws, plus the tile's 26 px of border and padding around the body (ADR-0003).
    // The renderer counts its own panels and margins; a tile whose data is missing counts as the bare renderer; a tile with no data-size is skipped.
    function tileMin(t) {
      var k = t.dataset.size, tile = t.dataset.tile, m = t.querySelector('[data-map]');
      try {
        if (tile === 'rayFan') return REC.fans ? ELEO.minWidth('curve', REC.fans) : ELEO.minWidth('curve');
        if (tile === 'mtf-limits') return REC.mtf ? ELEO.minWidth('curve', atWidth(REC.mtf, 0, { limits: MTF_LIMITS })) : ELEO.minWidth('curve');
        if (k === 'curve') return ELEO.minWidth('curve', REC[tile]);
        if (k === 'spot') return ELEO.minWidth('spot', REC[tile === 'footprint' ? 'footprint' : 'spot']);
        if (k === 'map2D') return ELEO.minWidth('map2D', m && MAPS[m.dataset.map]);
        return ELEO.minWidth(k);
      } catch (e) { console.error('gallery: ' + tile + ' minimum skipped:', e); return 0; }
    }
    function tileMins(theme) {
      theme.querySelectorAll('[data-size]').forEach(function (t) { t.style.setProperty('--tile-min', (tileMin(t) + 26) + 'px'); });
    }
    function draw() {
      document.querySelectorAll('.theme').forEach(function (theme) {
        theme.appendChild(document.getElementById('tiles').content.cloneNode(true));
        tileMins(theme);
        theme.querySelectorAll('[data-svg]').forEach(function (el) {
          var tile = SVG[el.dataset.svg], need = tile.need();
          if (!need) el.innerHTML = '';
          else ELEO.fit(el, function (w) { el.innerHTML = tile.draw(need, w); });
        });
        theme.querySelectorAll('[data-map]').forEach(function (el) { ELEO.fit(el, function (w) { el._w = w; drawMap(el); }); });
        // The glass and footprint legends key their own recordings; empty, like the tile, if its fixture failed.
        // The field and wavelength legends key the sample; empty, like its tiles, without it.
        theme.querySelectorAll('[data-legend]').forEach(function (el) {
          var k = el.dataset.legend;
          el.innerHTML = k === 'glass' ? (GLASSES ? ELEO.glassLegend(GLASSES) : '')
            : k === 'footprint' ? (REC.footprintAngles ? ELEO.legend('field', undefined, REC.footprintAngles) : '')
            : k === 'ts' || SAMPLE_BOX ? ELEO.legend(k) : '';
        });
        theme.querySelectorAll('[data-bar]').forEach(function (el) { el.style.background = ELEO.gradient(el.dataset.bar); });
        var icons = ELEO.icons.optical.map(function (i) { return ELEO.icon(i.name, { style: 'glass', size: 32, label: i.title }); })
          .concat(ELEO.icons.interface.map(function (i) { return ELEO.icon(i.name, { size: 24, label: i.title }); }));
        theme.querySelector('[data-icons]').innerHTML = icons.join('');
      });
      drawCanvases();
    }
    document.querySelector('header .palette').addEventListener('change', function (e) {
      var v = e.target.value;
      if (v === 'standard') document.documentElement.removeAttribute('data-palette');
      else document.documentElement.dataset.palette = v;
      drawMaps();
      drawCanvases();
    });
    var glasses = fetch('/tests/fixtures/layouts/analysis-glasses.json').then(function (r) {
      if (!r.ok) throw new Error('analysis-glasses.json: ' + r.status);
      return r.json();
    }).then(function (d) { GLASSES = d; }).catch(function (e) {
      console.error('gallery: glasses tile skipped:', e);
    });
    var merit = Promise.all(['before', 'after'].map(function (k) {
      return fetch('/tests/fixtures/layouts/merit-' + k + '.json').then(function (r) {
        if (!r.ok) throw new Error('merit-' + k + '.json: ' + r.status);
        return r.json();
      }).then(function (d) { MERIT[k] = d; });
    })).then(function () {
      MERIT_BOX = ELEO.layoutBounds([MERIT.before, MERIT.after]);
    }).catch(function (e) {
      console.error('gallery: merit tile skipped:', e);
    });
    var adapters = new Promise(function (ok, no) {
      var el = document.createElement('script');
      el.src = '/tests/fixtures/phos-core/adapters.js';
      el.onload = ok;
      el.onerror = function () { no(new Error('adapters.js failed to load')); };
      document.head.appendChild(el);
    });
    // One recorded tile: fetch the fixture, run it through its adapter; a failure blanks only that tile.
    function recorded(name, lens, file, draw) {
      return adapters.then(function () {
        return fetch('/tests/fixtures/phos-core/' + lens + '-' + file + '.json');
      }).then(function (r) {
        if (!r.ok) throw new Error(lens + '-' + file + '.json: ' + r.status);
        return r.json();
      }).then(draw).catch(function (e) {
        console.error('gallery: ' + name + ' tile skipped:', e);
      });
    }
    var phos = Promise.all([
      ['achromat', [
        ['mtf', 'mtf', function (d) { REC.mtf = globalThis.ELEOAdapters.mtf(d, { diffraction: true }); }],
        ['fieldCurvature', 'field-curvature', function (d) { REC.fieldCurvature = globalThis.ELEOAdapters.fieldCurvature(d); }],
        ['distortion', 'distortion', function (d) { REC.distortion = globalThis.ELEOAdapters.distortion(d); }],
        ['spot', 'spot', function (d) { REC.spot = globalThis.ELEOAdapters.spot(d); }],
        ['fans', 'fans', function (d) { REC.fans = globalThis.ELEOAdapters.fans(d); }],
        ['seidel', 'seidel', function (d) { REC.seidel = globalThis.ELEOAdapters.seidel(d); REC.seidelTerms = globalThis.ELEOAdapters.seidel(d, { by: 'term' }); }]
      ]],
      ['wandersleb', [
        ['layout', 'layout', function (d) { REC.layout = globalThis.ELEOAdapters.layout(d); }]
      ]],
      ['cooke', [
        ['psf', 'psf', function (d) { var A = globalThis.ELEOAdapters; MAPS['psf-recorded'] = A.psf(d); MAPS['psf-log'] = A.psf(d, { log: true }); }],
        ['wavefront', 'wavefront', function (d) { MAPS['wavefront-recorded'] = globalThis.ELEOAdapters.wavefront(d); }],
        ['footprint', 'footprint', function (d) { REC.footprint = globalThis.ELEOAdapters.footprint(d); REC.footprintAngles = d.sources.map(function (src) { return src.fieldAngleDeg; }); }]
      ]],
      ['cassegrain', [
        ['cassegrainLayout', 'layout', function (d) { REC.cassegrainLayout = globalThis.ELEOAdapters.layout(d); }]
      ]]
    ].reduce(function (all, lt) {
      return all.concat(lt[1].map(function (t) { return recorded(t[0], lt[0], t[1], t[2]); }));
    }, []));
    Promise.all([glasses, merit, phos]).then(function () {
      draw();
      document.body.dataset.ready = 'true';
    });
  </script>
